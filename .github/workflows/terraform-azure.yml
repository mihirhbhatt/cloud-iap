name: Terraform Azure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format
        run: terraform -chdir=terraform/azure fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=terraform/azure init -upgrade

      - name: Terraform Validate
        run: terraform -chdir=terraform/azure validate

      - name: Terraform Plan
        run: terraform -chdir=terraform/azure plan -no-color
